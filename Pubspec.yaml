name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
      - run: flutter create. --project-name uae_truck_route
      - run: cp main.dart lib/main.dart || cp lib/main.dart lib/main.dart.bak && cp main.dart lib/main.dart || true
      - run: |
          if [ -f lib/main.dart ]; then echo "main exists"; else mkdir -p lib && cp main.dart lib/main.dart; fi
          if [ -f main.dart ]; then cp main.dart lib/main.dart; fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: truck-route-apk
          path: build/app/outputs/flutter-apk/app-release.apk
